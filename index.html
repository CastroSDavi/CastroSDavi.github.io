<!DOCTYPE html>
<html lang="pt-BR"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap"
        rel="stylesheet">
    <title>Histologia - Quiz Interativo</title> </head>

<body>
    <header>
        <h1 class="title-header">
            Histologia
        </h1>
        <p>
            <a class="about-link" href="#footer">Sobre</a>
        </p>
        <div>
            </div>
    </header>

    <nav>
        <ul class="navbar">
            <li>
                <a href="#" class="nav-link">Concepção</a>
            </li>
            <li>
                <a href="#" class="nav-link">Metabolismo</a>
            </li>
            <li>
                <a href="#" class="nav-link">Funções</a>
            </li>
        </ul>
    </nav>

    <main>
        <aside>
            <p class="aside-title">Pontuação</p>
            <div class="pontuacao-wrap">
                <p id="pontuacao">
                    0
                </p>
            </div>
            <div class="aside-info-wrap">
                <div class="icon-wrap icon-correct">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#3bcf76"> <path d="M382-240 154-468l57-57 171 171 367-367 57 57-424 424Z" />
                    </svg>
                </div>
                <p id="acertos">
                    Acertos <span id="acertos-numero">0</span>
                </p>
            </div>
            <div class="aside-info-wrap">
                <div class="icon-wrap icon-error" id="error">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px"
                        fill="#dc3545"> <path
                            d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
                    </svg>
                </div>
                <p id="erros">
                    Erros <span id="erros-numero">0</span>
                </p>
            </div>
        </aside>
        <div class="main-content">
            <section id="quiz-section" style="display: flex; flex-direction: column; gap: 20px;">
        
                <div id="progress-container" style="width: 100%; margin-bottom: 15px;">
                    <div id="progress-bar-fill" style="height: 10px; width: 0%; background-color: #114a9c; border-radius: 5px; transition: width 0.3s ease-out;"></div>
                    <span id="progress-text" style="font-size: 0.9em; color: #6c757d; float: right; margin-top: 2px;">0 / 0</span>
                </div>
        
                <h2>
                    <span id="categoria-titulo">Categoria</span>
                    <span>- Questão <span id="id-questao">1</span></span>
                </h2>
        
                <div class="question-wrap">
                    <div class="question-text">
                        <p id="pergunta-texto">Carregando pergunta...</p>
                    </div>
                    <div class="question">
                        <div class="image-question-wrap">
                            <img src="" alt="" id="pergunta-imagem" style="display: none; max-height: 400px; width: auto;">
                        </div>
                        <div class="answers-wrap" id="respostas-container">
                            </div>
                    </div>
                    <p id="referencia-questao" style="font-size: 0.9em; color: #6c757d; margin-top: 15px;"></p>
                </div>
            </section> <div class="navigation-buttons" style="display: none;">
                <button id="prev-btn" disabled>Anterior</button>
                <button id="next-btn">Próxima</button>
            </div>
        
            <div class="resultado-final-card" style="display: none;">
                <h3 class="resultado-final-titulo">Quiz Concluído!</h3>
                <p class="resultado-final-pontuacao">
                    Pontuação Final: <span class="pontos-valor">0</span>
                </p>
                <div class="resultado-final-detalhes">
                    <p>Acertos: <span class="acertos-valor">0</span></p>
                    <p>Erros: <span class="erros-valor">0</span></p>
                </div>
            </div>
        
        </div> ```
        
    </main>

    <footer id="footer">
        <p>
            &copy; Desenvolvido por Davi Castro
        </p>
    </footer>

    <script>
        // --- Classe Usuário ---
        class Usuario {
            constructor(nome = null, acertos = 0, erros = 0, pontos = 0) {
                this._nome = nome;
                this._acertos = acertos;
                this._erros = erros;
                this._pontos = pontos;
                this.atualizar_pontos();
            }
            get acertos() { return this._acertos; }
            get erros() { return this._erros; }
            get pontos() { return this._pontos; }
            set acertos(acertos) { this._acertos = acertos; this.atualizar_pontos(); }
            set erros(erros) { this._erros = erros; this.atualizar_pontos(); }
            resetarContadores() { this._acertos = 0; this._erros = 0; this.atualizar_pontos(); }
            atualizar_pontos() { this._pontos = (15 * this._acertos) - (5 * this._erros); if (this._pontos < 0) this._pontos = 0; }
        }
    
        // --- Array de Perguntas ---
        const perguntas = [
            // Concepção
            { id: 1, pergunta: "Qual é a principal função das células de Sertoli...", imagem: "", respostas: ["Produzir testosterona", "Formar a túnica albugínea", "Fornecer sustentação e formar a barreira hematotesticular", "Participar diretamente da espermiogênese"], correta: "Fornecer sustentação e formar a barreira hematotesticular", referencia: "Gartner, 5ª ed.", categoria: "Concepção" },
            { id: 2, pergunta: "Quais são as células espermatogênicas localizadas mais próximas ao lúmen...", imagem: "", respostas: ["Espermatogônias", "Células de Sertoli", "Espermátides", "Espermatócitos primários"], correta: "Espermátides", referencia: "Gartner, 5ª ed.", categoria: "Concepção" },
            { id: 3, pergunta: "Que tipo de epitélio reveste os dúctulos eferentes...", imagem: "", respostas: ["Epitélio simples pavimentoso", "Epitélio cúbico simples", "Epitélio com áreas alternadas de colunar ciliado e cúbico com microvilosidades", "Epitélio pseudoestratificado com estereocílios"], correta: "Epitélio com áreas alternadas de colunar ciliado e cúbico com microvilosidades", referencia: "Gartner, 5ª ed.", categoria: "Concepção" },
            { id: 4, pergunta: "Qual estrutura testicular contém as células de Leydig...", imagem: "", respostas: ["Epitélio seminífero", "Túnica própria", "Tecido intersticial entre os túbulos seminíferos", "Rede testicular (rete testis)"], correta: "Tecido intersticial entre os túbulos seminíferos", referencia: "Gartner, 5ª ed.", categoria: "Concepção" },
            { id: 5, pergunta: "Sobre o ducto deferente, é correto afirmar que:", imagem: "", respostas: ["Possui epitélio simples cúbico e camada muscular fina", "É revestido por epitélio pseudoestratificado com estereocílios e possui parede muscular espessa com três camadas", "Possui epitélio estratificado pavimentoso e camada adventícia espessa", "É formado por epitélio colunar ciliado e tecido fibroso denso"], correta: "É revestido por epitélio pseudoestratificado com estereocílios e possui parede muscular espessa com três camadas", referencia: "Gartner, 5ª ed.", categoria: "Concepção" },
            // Metabolismo
            { id: 6, pergunta: "Qual organela celular é a principal responsável pela respiração celular aeróbica?", imagem: "", respostas: ["Retículo Endoplasmático", "Complexo de Golgi", "Mitocôndria", "Lisossomo"], correta: "Mitocôndria", referencia: "Biologia Celular Básica", categoria: "Metabolismo" },
            { id: 7, pergunta: "O processo de glicólise ocorre em qual compartimento celular?", imagem: "", respostas: ["Mitocôndria", "Núcleo", "Citosol", "Peroxissomo"], correta: "Citosol", referencia: "Bioquímica Ilustrada", categoria: "Metabolismo" },
            // Funções
            { id: 8, pergunta: "Qual a principal função do tecido epitelial de revestimento?", imagem: "", respostas: ["Contração", "Sustentação", "Proteção e Absorção", "Transmissão de impulsos"], correta: "Proteção e Absorção", referencia: "Histologia Básica", categoria: "Funções" },
            { id: 9, pergunta: "Os neurônios são células especializadas na função de:", imagem: "", respostas: ["Produzir hormônios", "Realizar fagocitose", "Transmitir impulsos nervosos", "Armazenar gordura"], correta: "Transmitir impulsos nervosos", referencia: "Neurociência Fundamental", categoria: "Funções" }
        ];
    
        // --- Variáveis Globais do Quiz ---
        let perguntaAtual = 0;
        let perguntasFiltradas = [];
        let categoriaAtual = "Concepção";
        const usuario = new Usuario();
        let autoAvancoTimeoutId = null;
    
        // --- Elementos do DOM (Cache) ---
        const elCategoriaTitulo = document.getElementById('categoria-titulo');
        const elIdQuestao = document.getElementById('id-questao');
        const elPerguntaTexto = document.getElementById('pergunta-texto');
        const elPerguntaImagem = document.getElementById('pergunta-imagem');
        const elRespostasContainer = document.getElementById('respostas-container');
        const elReferencia = document.getElementById('referencia-questao');
        const elQuizSection = document.getElementById('quiz-section');
        const elMainContent = document.querySelector('.main-content');
        const elPontuacao = document.getElementById('pontuacao');
        const elAcertosNum = document.getElementById('acertos-numero');
        const elErrosNum = document.getElementById('erros-numero');
        const elPrevBtn = document.getElementById('prev-btn');
        const elNextBtn = document.getElementById('next-btn');
        const elNavigationButtons = document.querySelector('.navigation-buttons');
        const elResultadoCard = document.querySelector('.resultado-final-card');
        const elProgressBarFill = document.getElementById('progress-bar-fill');
        const elProgressText = document.getElementById('progress-text');
        const elProgressContainer = document.getElementById('progress-container');
    
        // --- Funções do Quiz ---
    
        function atualizarBarraProgresso() {
            if (!elProgressContainer || !elProgressBarFill || !elProgressText) { return; }
            if (!perguntasFiltradas || perguntasFiltradas.length === 0) {
                elProgressBarFill.style.width = '0%';
                elProgressText.innerText = '';
                elProgressContainer.style.display = 'none';
                return;
            }
            elProgressContainer.style.display = 'block';
            const totalPerguntas = perguntasFiltradas.length;
            const numeroQuestaoAtual = (perguntaAtual < totalPerguntas) ? perguntaAtual + 1 : totalPerguntas;
            const progressoPercentual = (numeroQuestaoAtual / totalPerguntas) * 100;
            elProgressBarFill.style.width = `${progressoPercentual}%`;
            elProgressText.innerText = `${numeroQuestaoAtual} / ${totalPerguntas}`;
        }
    
        function mostrarAviso(texto) {
            const existingAviso = document.querySelector('.aviso-mensagem');
            if (existingAviso) existingAviso.remove();
            if (elResultadoCard) elResultadoCard.style.display = 'none';
            const avisoP = document.createElement('p');
            avisoP.classList.add('aviso-mensagem');
            avisoP.textContent = texto;
            avisoP.style.textAlign = 'center';
            avisoP.style.padding = '20px';
            avisoP.style.color = '#6c757d';
            if (elResultadoCard) { elMainContent.insertBefore(avisoP, elResultadoCard); }
            else { elMainContent.appendChild(avisoP); }
        }
    
        function selecionarCategoria(categoria) {
            clearTimeout(autoAvancoTimeoutId);
            autoAvancoTimeoutId = null;
            perguntas.forEach(p => { delete p.respostaDada; });
            categoriaAtual = categoria;
            perguntasFiltradas = perguntas.filter(p => p.categoria === categoria);
            perguntaAtual = 0;
            usuario.resetarContadores();
            atualizar_pontuacao();
            atualizarBarraProgresso();
            if (elResultadoCard) elResultadoCard.style.display = 'none';
            const existingAviso = document.querySelector('.aviso-mensagem');
            if (existingAviso) existingAviso.remove();
            if (perguntasFiltradas.length > 0) {
                elQuizSection.style.display = 'flex';
                if(elNavigationButtons) elNavigationButtons.style.display = 'flex'; // Garante que botões apareçam
                carregarPergunta();
            } else {
                elQuizSection.style.display = 'none';
                if(elNavigationButtons) elNavigationButtons.style.display = 'none';
                mostrarAviso(`Nenhuma pergunta encontrada para ${categoria}.`);
            }
        }
    
        function carregarPergunta() {
            autoAvancoTimeoutId = null;
            atualizarBarraProgresso();
    
            if (perguntaAtual >= perguntasFiltradas.length) {
                mostrarResultadoFinal();
                return;
            }
    
            const pergunta = perguntasFiltradas[perguntaAtual];
            const jaRespondida = pergunta.hasOwnProperty('respostaDada');
    
            if (elResultadoCard) elResultadoCard.style.display = 'none';
            elQuizSection.style.display = 'flex';
             if(elNavigationButtons) elNavigationButtons.style.display = 'flex'; // Garante que botões apareçam
    
            elRespostasContainer.innerHTML = '';
            elCategoriaTitulo.innerText = categoriaAtual;
            elIdQuestao.innerText = perguntaAtual + 1;
            elPerguntaTexto.innerText = pergunta.pergunta;
            elReferencia.innerText = `Referência: ${pergunta.referencia}`;
    
            // Imagem
            if (pergunta.imagem && pergunta.imagem.trim() !== "") {
                elPerguntaImagem.src = pergunta.imagem;
                elPerguntaImagem.alt = `Imagem para a questão ${perguntaAtual + 1} de ${categoriaAtual}`;
                elPerguntaImagem.style.display = 'block';
            } else {
                elPerguntaImagem.style.display = 'none';
                elPerguntaImagem.src = "";
                elPerguntaImagem.alt = "";
            }
    
            // Cria/Restaura Respostas
            pergunta.respostas.forEach((respostaTexto) => {
                const p = document.createElement('p');
                p.classList.add('answer');
                p.innerText = respostaTexto;
                if (jaRespondida) {
                    p.onclick = null;
                    p.classList.add('answered');
                    if (respostaTexto === pergunta.correta) { p.classList.add('correct'); }
                    if (respostaTexto === pergunta.respostaDada && respostaTexto !== pergunta.correta) { p.classList.add('incorrect'); }
                } else {
                    p.onclick = () => verificarResposta(p, pergunta);
                }
                elRespostasContainer.appendChild(p);
            });
    
            // --- LÓGICA DO BOTÃO CORRIGIDA ---
            elPrevBtn.disabled = perguntaAtual === 0;
            elNextBtn.disabled = false; // <<< CORRIGIDO: Botão "Próxima" sempre habilitado ao carregar
    
            // Ajusta texto do botão "Próxima"
            if (perguntaAtual === perguntasFiltradas.length - 1) {
                elNextBtn.innerText = 'Ver Resultado';
                 // Opcional: Desabilitar apenas na última questão se não respondida
                 // Você pode descomentar a linha abaixo se quiser esse comportamento:
                 // elNextBtn.disabled = !jaRespondida;
            } else {
                elNextBtn.innerText = 'Próxima';
            }
            // --- FIM DA CORREÇÃO ---
        }
    
        function verificarResposta(elementoClicado, pergunta) {
            clearTimeout(autoAvancoTimeoutId);
            const respostaSelecionada = elementoClicado.innerText;
            const allAnswers = elRespostasContainer.querySelectorAll('.answer');
            pergunta.respostaDada = respostaSelecionada;
            allAnswers.forEach(ans => {
                ans.onclick = null;
                ans.classList.add('answered');
            });
            if (respostaSelecionada === pergunta.correta) {
                elementoClicado.classList.add("correct");
                usuario.acertos += 1;
            } else {
                elementoClicado.classList.add("incorrect");
                usuario.erros += 1;
                allAnswers.forEach(ans => {
                    if (ans.innerText === pergunta.correta) {
                        ans.classList.add('correct');
                    }
                });
            }
            atualizar_pontuacao();
            // A linha 'elNextBtn.disabled = false;' foi removida daqui pois é redundante
    
            autoAvancoTimeoutId = setTimeout(() => {
                proximaPergunta();
            }, 1500);
        }
    
        function proximaPergunta() {
            clearTimeout(autoAvancoTimeoutId);
            autoAvancoTimeoutId = null;
            perguntaAtual++;
            if (perguntaAtual < perguntasFiltradas.length) {
                carregarPergunta();
            } else {
                mostrarResultadoFinal();
            }
        }
    
        function perguntaAnterior() {
            clearTimeout(autoAvancoTimeoutId);
            autoAvancoTimeoutId = null;
            if (perguntaAtual > 0) {
                perguntaAtual--;
                carregarPergunta();
            }
        }
    
        function mostrarResultadoFinal() {
            clearTimeout(autoAvancoTimeoutId);
            autoAvancoTimeoutId = null;
            elQuizSection.style.display = 'none';
            if(elNavigationButtons) elNavigationButtons.style.display = 'none';
            if (elProgressContainer) elProgressContainer.style.display = 'none';
            if (elResultadoCard) {
                elResultadoCard.style.display = 'block';
                preencherMensagemFinal();
            } else {
                console.error("Elemento '.resultado-final-card' não encontrado.");
            }
        }
    
        function preencherMensagemFinal() {
            if (!elResultadoCard) return;
            const tituloResultado = elResultadoCard.querySelector('.resultado-final-titulo');
            const pontuacaoResultado = elResultadoCard.querySelector('.resultado-final-pontuacao .pontos-valor');
            const acertosResultado = elResultadoCard.querySelector('.resultado-final-detalhes .acertos-valor');
            const errosResultado = elResultadoCard.querySelector('.resultado-final-detalhes .erros-valor');
            if (tituloResultado) tituloResultado.textContent = `Quiz de ${categoriaAtual} Concluído!`;
            if (pontuacaoResultado) pontuacaoResultado.textContent = usuario.pontos;
            if (acertosResultado) acertosResultado.textContent = usuario.acertos;
            if (errosResultado) errosResultado.textContent = usuario.erros;
        }
    
        function atualizar_pontuacao() {
            elPontuacao.innerText = usuario.pontos;
            elAcertosNum.innerText = usuario.acertos;
            elErrosNum.innerText = usuario.erros;
        }
    
        // --- Inicialização e Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            if (!elPrevBtn || !elNextBtn || !elNavigationButtons || !elResultadoCard || !elQuizSection || !elRespostasContainer || !elMainContent || !elPontuacao || !elAcertosNum || !elErrosNum || !elProgressContainer || !elProgressBarFill || !elProgressText) {
                console.error("Erro Crítico: Um ou mais elementos essenciais do DOM não foram encontrados.");
                alert("Ocorreu um erro ao carregar o quiz. Verifique o console para detalhes.");
                return;
            }
            document.querySelectorAll('.nav-link').forEach(link => {
                link.addEventListener('click', (event) => {
                    event.preventDefault();
                    const categoria = event.target.innerText;
                    selecionarCategoria(categoria);
                });
            });
            elPrevBtn.addEventListener('click', perguntaAnterior);
            elNextBtn.addEventListener('click', proximaPergunta);
            selecionarCategoria(categoriaAtual);
        });
    
    </script>
</body>
</html>
